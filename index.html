<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Analyzer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #999;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .info {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume to predict the most relevant job category.
        </p>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <div class="upload-box">

                <p>Select your resume PDF</p>

                <input type="file"
                       name="resume"
                       accept=".pdf"
                       required>

            </div>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

        <p class="info">
            Supported format: PDF
        </p>

    </div>

</body>

</html>
